name: CRUCIBLE Linter & Audit Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-reports:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install markdown

    - name: Run CRUCIBLE Deterministic Linter on Showcase Benchmarks
      run: |
        for file in showcase/en/*.md showcase/tr/*.md; do
          echo "Auditing: $file"
          python scripts/crucible_linter.py "$file"
        done
